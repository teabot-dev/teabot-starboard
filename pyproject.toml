[project]
name = "teabot-starboard"
version = "1.0.0"
description = "Starboards for teabot: a message that gets enough of a board's emoji is reposted to its channel."
readme = "README.md"
license = "MIT"
authors = [{ name = "teabot-dev" }]
requires-python = ">=3.12"
dependencies = ["teabot>=1.7,<2"]

[project.urls]
Source = "https://github.com/teabot-dev/teabot-starboard"

[project.entry-points."teabot.plugins"]
starboard = "teabot_starboard:plugin"

[dependency-groups]
dev = ["teabot[testing]", "pyright>=1.1.414", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teabot_starboard"]

[tool.pytest.ini_options]
addopts = "-p teabot.testing.fixtures"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 120

[tool.pyright]
typeCheckingMode = "strict"
